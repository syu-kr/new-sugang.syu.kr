    <script>
      const filter = 'win16|win32|win64|mac|macintel'
      if (navigator.platform) {
        if (filter.indexOf(window.navigator.platform.toLowerCase()) < 0) {
          document.getElementById('notice').innerText = '컴퓨터 / PC 환경을 권장합니다.'
        } else {
          document.getElementById('notice').innerText = '브라우저 전체 화면을 권장합니다.'
        }
      }
    </script>
    <script>
      function formatTime(seconds) {
        const hours = Math.floor(seconds / 3600)
        const minutes = Math.floor((seconds % 3600) / 60)
        const secs = seconds % 60
        return String(hours).padStart(2, '0') + ':' + String(minutes).padStart(2, '0') + ':' + String(secs).padStart(2, '0')
      }

      function loading() {
        document.getElementById('wait-screen').style.display = ''
        const loading = document.getElementById('wait')
        loading.style.display = ''

        const time = 4
        let percent = 0
        let realTime = time

        // 클릭 방지 함수
        const preventClick = (e) => {
          if (e.target.id !== 'netfunnel' && !document.getElementById('netfunnel').contains(e.target)) {
            e.preventDefault()
            e.stopPropagation()
          }
        }
        document.addEventListener('click', preventClick, true)
        document.addEventListener('touchstart', preventClick, true)

        const checker = setInterval(function () {
          percent += 400 / time
          document.getElementById('time').innerText = formatTime(realTime)
          document.getElementById('progressbar').innerHTML = '<div style="width: ' + (percent > 390 ? 400 : percent) + 'px; height: 20px; background-color: #2f5bea"></div>'
          if (realTime-- <= 0) {
            // 클릭 방지 제거
            document.removeEventListener('click', preventClick, true)
            document.removeEventListener('touchstart', preventClick, true)
            location.href = 'https://sugang.syu.kr/test1'
          }
        }, 1000)
      }
    </script>
