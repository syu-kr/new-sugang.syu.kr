    <script>

      if (navigator.platform) {
        if (filter.indexOf(window.navigator.platform.toLowerCase()) < 0) {

    <script>
      const queueStepMs = 100

      const queueDefaults = {
        activeCount: 100,
      }

      const queueState = {
        activeCount: queueDefaults.activeCount,
        dequeueIntervalMs: queueStepMs,
        estimatedWaitMs: 10000,
        estimatedWaitSeconds: 10,
      }

      const reactionTargetTime = 10 * 60 * 60 * 1000
      const reactionReadyClock = reactionTargetTime - 5000
      const reactionState = {
        animationFrameId: 0,
        started: false,
        running: false,
        startTime: 0,
        simulatedStartTime: reactionReadyClock,
        bestDiffMs: null,
      }

      const queueElements = {
        activeCount: document.getElementById('queue-active-count'),
        apply: document.getElementById('queue-apply'),
        reset: document.getElementById('queue-reset'),
        previewTime: document.getElementById('queue-preview-time'),
        previewStep: document.getElementById('queue-preview-step'),
        modalActive: document.getElementById('queue-active-display'),
        modalTime: document.getElementById('time'),
      }

      const reactionElements = {
        clock: document.getElementById('reaction-clock'),
        resultMs: document.getElementById('reaction-result-ms'),
        bestMs: document.getElementById('reaction-best-ms'),
        login: document.getElementById('imgLogin'),
        start: document.getElementById('reaction-start'),
        retry: document.getElementById('reaction-retry'),
        reset: document.getElementById('reaction-reset'),
      }

      function clampNumber(value, min, max, fallback) {
        const parsed = Number.parseInt(value, 10)
        if (Number.isNaN(parsed)) {
          return fallback
        }

        return Math.min(Math.max(parsed, min), max)
      }

      function formatTime(seconds) {
        const safeSeconds = Math.max(0, seconds)
        const hours = Math.floor(safeSeconds / 3600)
        const minutes = Math.floor((safeSeconds % 3600) / 60)
        const secs = safeSeconds % 60
        return String(hours).padStart(2, '0') + ':' + String(minutes).padStart(2, '0') + ':' + String(secs).padStart(2, '0')
      }

      function formatClockTime(milliseconds) {
        const totalSeconds = Math.floor(Math.max(0, milliseconds) / 1000)
        const hours = Math.floor(totalSeconds / 3600)
        const minutes = Math.floor((totalSeconds % 3600) / 60)
        const seconds = totalSeconds % 60
        return String(hours).padStart(2, '0') + ':' + String(minutes).padStart(2, '0') + ':' + String(seconds).padStart(2, '0')
      }

      function formatDiff(milliseconds) {
        if (milliseconds === null) {
          return '-'
        }

        if (milliseconds === 0) {
          return '0ms'
        }

        const sign = milliseconds > 0 ? '+' : '-'
        return sign + Math.abs(milliseconds).toLocaleString('ko-KR') + 'ms'
      }

      function formatStep(seconds) {
        return seconds.toFixed(1) + '초'
      }

      function recalculateQueueState() {
        const safeActiveCount = clampNumber(queueState.activeCount, 1, 9999, queueDefaults.activeCount)
        const dequeueIntervalMs = queueStepMs
        const estimatedWaitMs = safeActiveCount * dequeueIntervalMs

        queueState.activeCount = safeActiveCount
        queueState.dequeueIntervalMs = dequeueIntervalMs
        queueState.estimatedWaitMs = estimatedWaitMs
        queueState.estimatedWaitSeconds = Math.ceil(estimatedWaitMs / 1000)
      }

      function syncQueueInputs() {
        queueElements.activeCount.value = String(queueState.activeCount)
      }

      function renderQueueState() {
        recalculateQueueState()
        queueElements.previewTime.innerText = formatTime(queueState.estimatedWaitSeconds)
        queueElements.previewStep.innerText = formatStep(queueState.dequeueIntervalMs / 1000)
        queueElements.modalTime.innerText = formatTime(queueState.estimatedWaitSeconds)
        queueElements.modalActive.innerText = queueState.activeCount.toLocaleString('ko-KR') + '명'
      }

      function applyQueueSettings() {
        queueState.activeCount = clampNumber(queueElements.activeCount.value, 1, 9999, queueDefaults.activeCount)

        syncQueueInputs()
        renderQueueState()
      }

      function resetQueueSettings() {
        queueState.activeCount = queueDefaults.activeCount

        syncQueueInputs()
        renderQueueState()
      }

      function updateReactionButtons() {
        reactionElements.start.disabled = reactionState.running
        reactionElements.retry.disabled = !reactionState.started
        reactionElements.start.innerText = reactionState.running ? '진행 중' : '시작하기'
        reactionElements.login.classList.toggle('practice-armed', reactionState.running)
      }

      function renderReactionClock(milliseconds) {
        reactionElements.clock.innerText = formatClockTime(milliseconds)
      }

      function stopReactionTicker() {
        if (reactionState.animationFrameId) {
          window.cancelAnimationFrame(reactionState.animationFrameId)
          reactionState.animationFrameId = 0
        }
      }

      function getReactionSimulatedTime(now) {
        return reactionState.simulatedStartTime + (now - reactionState.startTime)
      }

      function finishReactionTest(diffMs) {
        reactionState.running = false
        stopReactionTicker()

        if (reactionState.bestDiffMs === null || Math.abs(diffMs) < Math.abs(reactionState.bestDiffMs)) {
          reactionState.bestDiffMs = diffMs
        }

        renderReactionClock(reactionTargetTime + diffMs)
        reactionElements.resultMs.innerText = formatDiff(diffMs)
        reactionElements.bestMs.innerText = formatDiff(reactionState.bestDiffMs)
        updateReactionButtons()
      }

      function tickReactionTest() {
        if (!reactionState.running) {
          return
        }

        renderReactionClock(getReactionSimulatedTime(performance.now()))
        reactionState.animationFrameId = window.requestAnimationFrame(tickReactionTest)
      }

      function startReactionTest() {
        stopReactionTicker()
        reactionState.started = true
        reactionState.running = true
        reactionState.startTime = performance.now()
        reactionState.simulatedStartTime = reactionTargetTime - (4200 + Math.floor(Math.random() * 2400))

        reactionElements.resultMs.innerText = '-'
        updateReactionButtons()
        tickReactionTest()
      }

      function resetReactionTest() {
        reactionState.started = false
        reactionState.running = false
        reactionState.startTime = 0
        reactionState.simulatedStartTime = reactionReadyClock
        reactionState.bestDiffMs = null

        stopReactionTicker()
        renderReactionClock(reactionReadyClock)
        reactionElements.resultMs.innerText = '-'
        reactionElements.bestMs.innerText = '-'
        updateReactionButtons()
      }

      function submitReactionTest() {
        if (!reactionState.running) {
          return
        }

        const diffMs = Math.round(getReactionSimulatedTime(performance.now()) - reactionTargetTime)
        finishReactionTest(diffMs)
      }

      function handleLoginClick() {
        if (reactionState.running) {
          submitReactionTest()
          return false
        }

        loading()
        return false
      }

      window.handleLoginClick = handleLoginClick

      queueElements.apply.addEventListener('click', applyQueueSettings)
      queueElements.reset.addEventListener('click', resetQueueSettings)
      reactionElements.start.addEventListener('click', startReactionTest)
      reactionElements.retry.addEventListener('click', startReactionTest)
      reactionElements.reset.addEventListener('click', resetReactionTest)

      resetQueueSettings()
      resetReactionTest()

      function loading() {
        document.getElementById('wait-screen').style.display = ''
        const loading = document.getElementById('wait')
        const progressBar = document.getElementById('progressbar')
        loading.style.display = ''
        renderQueueState()

        const totalWaitMs = queueState.estimatedWaitMs
        const initialActiveCount = queueState.activeCount
        const startedAt = Date.now()

        const preventClick = (e) => {
          if (e.target.id !== 'netfunnel' && !document.getElementById('netfunnel').contains(e.target)) {
            e.preventDefault()
            e.stopPropagation()
          }
        }

        const finishLoading = () => {
          document.removeEventListener('click', preventClick, true)
          document.removeEventListener('touchstart', preventClick, true)
          location.href = 'https://sugang.syu.kr/test1'
        }

        document.addEventListener('click', preventClick, true)
        document.addEventListener('touchstart', preventClick, true)

        if (totalWaitMs <= 0) {
          progressBar.style.width = '100%'
          queueElements.modalTime.innerText = '00:00:00'
          queueElements.modalActive.innerText = '0명'
          setTimeout(finishLoading, 150)
          return
        }

        const checker = setInterval(function () {
          const elapsedMs = Date.now() - startedAt
          const remainingMs = Math.max(totalWaitMs - elapsedMs, 0)
          const processedCount = Math.min(initialActiveCount, Math.floor(elapsedMs / queueState.dequeueIntervalMs))
          const remainingActiveCount = Math.max(initialActiveCount - processedCount, 0)
          const percent = Math.min((elapsedMs / totalWaitMs) * 100, 100)

          queueElements.modalTime.innerText = formatTime(Math.ceil(remainingMs / 1000))
          queueElements.modalActive.innerText = remainingActiveCount.toLocaleString('ko-KR') + '명'
          progressBar.style.width = percent + '%'

          if (elapsedMs >= totalWaitMs || remainingActiveCount <= 0) {
            clearInterval(checker)
            finishLoading()
          }
        }, 100)
      }
    </script>

    <div class="watermark" aria-hidden="true" role="presentation"></div>
  </body>
</html>
