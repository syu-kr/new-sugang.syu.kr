    <script>
      function adjustColumnWidths() {
        const table = document.querySelector('table')
        const visibleCols = table.querySelectorAll('th:not(.hidden-col)')
        const widthPerCol = 100 / visibleCols.length
        visibleCols.forEach((th) => (th.style.width = widthPerCol + '%'))
      }

      document.querySelectorAll('.col-toggle').forEach((checkbox) => {
        checkbox.addEventListener('change', function () {
          const colClass = 'col-' + this.dataset.col
          document.querySelectorAll('.' + colClass).forEach((el) => {
            el.classList.toggle('hidden-col', !checkbox.checked)
          })
          adjustColumnWidths() // 숨김 후 폭 재조정
        })
      })

      adjustColumnWidths()
    </script>
    <script>
      const colStates = {
        courseNo: true,
        professor: true,
        count: true,
        rate: true,
      }

      document.querySelectorAll('.col-toggle').forEach((checkbox) => {
        colStates[checkbox.dataset.col] = checkbox.checked

        checkbox.addEventListener('change', function () {
          colStates[this.dataset.col] = this.checked
        })
      })
    </script>
    <script>
      const input = document.getElementById('search')
      // URL에서 search 파라미터를 읽어 입력창에 채워넣기
      const searchParams = new URLSearchParams(window.location.search)
      const initialSearch = searchParams.get('search') || ''
      if (input && initialSearch) {
        input.value = initialSearch
      }

      input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
          const keyword = this.value.trim()
          const url = new URL(window.location.href)
          if (keyword) {
            url.searchParams.set('search', keyword)
          } else {
            url.searchParams.delete('search')
          }
          window.location.href = url.toString()
        }
      })

      const searchIcon = document.querySelector('.search-icon')
      function doSearch() {
        const keyword = input.value.trim()
        const url = new URL(window.location.href)
        if (keyword) {
          url.searchParams.set('search', keyword)
        } else {
          url.searchParams.delete('search')
        }
        window.location.href = url.toString()
      }

      if (searchIcon) {
        searchIcon.addEventListener('click', doSearch)
        searchIcon.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault()
            doSearch()
          }
        })
      }

      const searchBtn = document.getElementById('search-btn')
      if (searchBtn) {
        searchBtn.addEventListener('click', doSearch)
        searchBtn.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault()
            doSearch()
          }
        })
      }
    </script>
    <script>
      ;(function () {
        const countdownEl = document.getElementById('countdown')
        const statusEl = document.getElementById('status-text')
        const URGENT_THRESHOLD_MS = 30 * 60 * 1000 // 30 minutes

        function getTodayTarget(ref) {
          return new Date(ref.getFullYear(), ref.getMonth(), ref.getDate(), 17, 0, 0, 0)
        }

        function formatTime(ms) {
          const hours = Math.floor(ms / (1000 * 60 * 60))
          const mins = Math.floor((ms % (1000 * 60 * 60)) / (1000 * 60))
          const secs = Math.floor((ms % (1000 * 60)) / 1000)
          return `${String(hours).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`
        }

        function updateCountdown() {
          const now = new Date()

          if (!countdownEl) return

          // 2026-01-28 17:00
          const FINAL_DEADLINE = new Date(2026, 0, 28, 17, 0, 0)

          if (now >= FINAL_DEADLINE) {
            countdownEl.textContent = '마감되었습니다.'
            countdownEl.classList.remove('urgent')
            if (statusEl) {
              statusEl.textContent = '최종 경쟁률'
              statusEl.classList.add('status-closed')
            }
            return
          }

          const diff = FINAL_DEADLINE - now
          countdownEl.textContent = `마감까지 ${formatTime(diff)}`

          if (diff <= URGENT_THRESHOLD_MS) {
            countdownEl.classList.add('urgent')
            countdownEl.title = '마감까지 30분 이내입니다.'
          } else {
            countdownEl.classList.remove('urgent')
            countdownEl.title = '오늘 오후 5시에 집계가 마감됩니다.'
          }

          if (statusEl) {
            statusEl.textContent = '실시간 집계중'
            statusEl.classList.remove('status-closed')
          }
        }

        updateCountdown()
        setInterval(updateCountdown, 1000)
      })()
    </script>
